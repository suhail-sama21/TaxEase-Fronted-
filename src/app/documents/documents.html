<div class="max-w-7xl mx-auto p-6">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

    <div class="bg-[var(--theme-card)] border border-[var(--theme-border)] rounded-2xl p-8 shadow-sm">
      <h2 class="text-xl font-bold text-[var(--theme-text)] mb-6">Register Document</h2>

      <div *ngIf="isUploaded" class="text-center py-6">
        <div class="w-12 h-12 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
        </div>
        <p class="text-green-500 font-bold mb-6">Linked Successfully!</p>
        <button (click)="resetUpload()" class="px-6 py-2 bg-app-primary text-white rounded-xl text-sm font-medium">Link Another</button>
      </div>

      <div *ngIf="!isUploaded" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-[var(--theme-muted)] uppercase mb-2">Filing ID</label>
          <input type="number" [(ngModel)]="uploadFilingId" placeholder="ID" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl px-4 py-3 text-sm text-[var(--theme-text)] outline-none focus:border-app-primary">
        </div>
        <div>
          <label class="block text-xs font-semibold text-[var(--theme-muted)] uppercase mb-2">Document URL</label>
          <textarea #urlInput rows="3" placeholder="https://..." class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl px-4 py-3 text-sm text-[var(--theme-text)] outline-none focus:border-app-primary resize-none"></textarea>
        </div>

        <button type="button"
                (click)="$event.preventDefault(); submitUrl()"
                [disabled]="isSubmitting || !uploadFilingId"
                class="w-full bg-app-primary text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2">
          <span *ngIf="isSubmitting" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          Link Document
        </button>
        <p *ngIf="uploadMessage" class="text-center text-xs text-red-500 font-medium">{{ uploadMessage }}</p>
      </div>
    </div>

    <div class="bg-[var(--theme-card)] border border-[var(--theme-border)] rounded-2xl p-8 shadow-sm">
      <h2 class="text-xl font-bold text-[var(--theme-text)] mb-6">Search Records</h2>

      <div class="flex gap-2 mb-8">
        <input type="number" [(ngModel)]="fetchFilingId" placeholder="Enter Filing ID" class="flex-1 bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl px-4 py-3 text-sm text-[var(--theme-text)] outline-none focus:border-app-primary">
        <button (click)="loadDocuments()" [disabled]="isFetching" class="px-6 bg-app-primary text-white rounded-xl text-sm font-bold flex items-center gap-2">
          <span *ngIf="isFetching" class="w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          Fetch
        </button>
      </div>

      <div class="overflow-hidden border border-[var(--theme-border)] rounded-xl">
        <table class="w-full text-sm text-left">
          <thead class="bg-[var(--theme-bg)] text-[var(--theme-muted)] text-xs uppercase">
          <tr>
            <th class="px-4 py-3 font-medium w-24">Doc ID</th>
            <th class="px-4 py-3 font-medium">Document URL</th>
          </tr>
          </thead>
          <tbody class="divide-y divide-[var(--theme-border)]">
          <tr *ngFor="let doc of fetchedDocs" class="hover:bg-[var(--theme-bg)] transition-colors">
            <td class="px-4 py-3 text-app-primary font-mono text-xs">#{{ doc.id }}</td>
            <td class="px-4 py-3">
              <a [href]="doc.fileUrl"
                 target="_blank"
                 class="text-app-primary hover:underline text-xs break-all block max-w-[400px]"
                 [title]="doc.fileUrl">
                {{ doc.fileUrl }}
              </a>
            </td>
          </tr>
          <tr *ngIf="fetchedDocs.length === 0">
            <td colspan="2" class="px-4 py-10 text-center text-[var(--theme-muted)] italic">
              {{ fetchMessage || 'No records fetched yet.' }}
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
