<div class="max-w-6xl mx-auto p-6">
  <div class="mb-6">
    <h1 class="text-xl font-medium text-[var(--theme-text)] transition-colors duration-300">Filing Document Registry</h1>
    <p class="text-[13px] text-[var(--theme-muted)] mt-1 transition-colors duration-300">Register external document URLs for your tax filings.</p>
  </div>

  <div class="grid grid-cols-[320px_1fr] gap-6">

    <!-- Left Panel: Registry Form -->
    <div>
      <div class="bg-[var(--theme-surface)] border border-[var(--theme-border)] rounded-xl p-6 sticky top-6 transition-colors duration-300">
        <h2 class="text-[14px] font-medium text-[var(--theme-text)] mb-4 transition-colors duration-300">Register New Link</h2>

        <!-- Filing ID (NotNull) -->
        <div class="mb-4">
          <label class="block text-xs text-[var(--theme-muted)] mb-1.5 transition-colors duration-300">Filing ID <span class="text-app-danger">*</span></label>
          <input type="number" [(ngModel)]="currentFilingId"
                 class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-lg text-[var(--theme-text)] text-sm px-3 py-2.5 outline-none focus:border-app-primary transition-colors duration-300"
                 placeholder="Enter ID (e.g. 101)">
        </div>

        <!-- File URL (NotBlank, Max 1000) -->
        <div class="mb-5">
          <label class="block text-xs text-[var(--theme-muted)] mb-1.5 transition-colors duration-300">Document URL <span class="text-app-danger">*</span></label>
          <textarea #urlInput
                    rows="3"
                    class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-lg text-[var(--theme-text)] text-sm px-3 py-2.5 outline-none focus:border-app-primary resize-none transition-colors duration-300"
                    placeholder="https://... (Max 1000 chars)"></textarea>
        </div>

        <button (click)="submitUrl(urlInput.value)"
                [disabled]="isUploading || !urlInput.value || !currentFilingId"
                class="w-full bg-app-primary hover:bg-app-primary-hover text-white rounded-lg py-2.5 text-[13px] font-medium transition-colors disabled:opacity-50 flex items-center justify-center gap-2">
          <div *ngIf="isUploading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          {{ isUploading ? 'Processing...' : 'Register Link' }}
        </button>
      </div>
    </div>

    <!-- Right Panel: Documents List -->
    <div class="bg-[var(--theme-surface)] border border-[var(--theme-border)] rounded-xl overflow-hidden shadow-sm h-fit transition-colors duration-300">
      <div class="px-5 py-4 border-b border-[var(--theme-border)] flex items-center justify-between bg-[var(--theme-card)] transition-colors duration-300">
        <span class="text-[15px] font-medium text-[var(--theme-text)] transition-colors duration-300">Linked Documents</span>
        <span class="text-[12px] text-[var(--theme-muted)] transition-colors duration-300">{{ uploadedDocs.length }} Total</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full border-collapse text-[13px]">
          <thead>
          <tr class="bg-[var(--theme-card)] border-b border-[var(--theme-border)] transition-colors duration-300">
            <th class="px-5 py-3 text-left text-[var(--theme-muted)] text-[10px] uppercase tracking-wide font-normal transition-colors duration-300">Document ID</th>
            <th class="px-5 py-3 text-left text-[var(--theme-muted)] text-[10px] uppercase tracking-wide font-normal transition-colors duration-300">File URL</th>
            <th class="px-5 py-3 text-left text-[var(--theme-muted)] text-[10px] uppercase tracking-wide font-normal transition-colors duration-300">Date Registered</th>
            <th class="px-5 py-3 text-left text-[var(--theme-muted)] text-[10px] uppercase tracking-wide font-normal transition-colors duration-300">Action</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let doc of uploadedDocs" class="hover:bg-[var(--theme-bg)] border-b border-[var(--theme-border)] last:border-0 transition-colors duration-300">
            <td class="px-5 py-3 text-app-primary font-mono text-[12px]">#{{ doc.id }}</td>
            <td class="px-5 py-3">
              <div class="max-w-[300px] truncate text-[var(--theme-text)] transition-colors duration-300" [title]="doc.fileUrl">
                {{ doc.fileUrl }}
              </div>
            </td>
            <td class="px-5 py-3 text-[var(--theme-muted)] transition-colors duration-300">{{ doc.uploadedDate | date:'mediumDate' }}</td>
            <td class="px-5 py-3">
              <a [href]="doc.fileUrl" target="_blank"
                 class="bg-transparent border border-[var(--theme-border)] text-[var(--theme-muted)] rounded-md px-3 py-1 text-[11px] hover:bg-[var(--theme-bg)] hover:text-[var(--theme-text)] transition-colors duration-300 inline-block">
                View Source
              </a>
            </td>
          </tr>
          <tr *ngIf="uploadedDocs.length === 0">
            <td colspan="4" class="px-5 py-8 text-center text-[var(--theme-muted)] text-[13px] transition-colors duration-300">No documents found.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
