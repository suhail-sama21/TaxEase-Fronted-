<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-xl font-medium text-(--theme-text) transition-colors duration-300">Notifications</h1>
      <p class="text-[13px] text-(--theme-muted) mt-1 transition-colors duration-300">Manage your alerts and system messages.</p>
    </div>
    <button (click)="markAllAsRead()" class="bg-transparent border border-(--theme-border) text-(--theme-muted) rounded-md px-3.5 py-2 text-[13px] cursor-pointer hover:bg-(--theme-surface) hover:text-(--theme-text) transition-colors duration-300">
      Mark all as read
    </button>
  </div>

  <div class="bg-(--theme-card) border border-(--theme-border) rounded-xl overflow-hidden shadow-sm transition-colors duration-300">
    <div class="flex flex-col">
      
      <div *ngFor="let n of notifications"
           (click)="markAsRead(n)"
           class="flex gap-4 p-5 border-b border-(--theme-border) last:border-0 cursor-pointer transition-colors duration-300 relative"
           [ngClass]="n.read ? 'hover:bg-(--theme-surface)' : 'bg-[#1f6feb]/5 hover:bg-[#1f6feb]/10'">

        <div class="w-9 h-9 rounded-full flex items-center justify-center text-[15px] shrink-0 mt-0.5 transition-colors duration-300"
             [ngClass]="{
               'bg-[#e3b341]/10 text-[#e3b341]': n.type === 'warning',
               'bg-[#3fb950]/10 text-[#3fb950]': n.type === 'success',
               'bg-[#1f6feb]/10 text-[#1f6feb]': n.type === 'info',
               'bg-(--theme-surface) text-(--theme-muted) border border-(--theme-border)': n.type === 'system',
               'bg-[#bc8cff]/10 text-[#bc8cff]': n.type === 'verified'
             }">
          {{ n.icon }}
        </div>

        <div class="flex-1">
          <div class="text-[14px] font-medium mb-1 transition-colors duration-300" 
               [ngClass]="n.read ? 'text-(--theme-muted)' : 'text-(--theme-text)'">
            {{ n.title }}
          </div>
          <div class="text-[13px] text-(--theme-muted) leading-relaxed mb-1.5 transition-colors duration-300">
            {{ n.desc }}
          </div>
          <div class="text-[11px] text-(--theme-muted) opacity-80 transition-colors duration-300">
            {{ n.time }}
          </div>
        </div>

        <div *ngIf="!n.read" class="w-2.5 h-2.5 rounded-full bg-[#1f6feb] mt-1.5 shrink-0 shadow-[0_0_8px_rgba(31,111,235,0.6)] transition-colors duration-300"></div>
      </div>
      
    </div>
  </div>
</div>
