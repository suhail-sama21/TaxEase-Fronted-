<div class="flex h-screen w-full bg-(--theme-bg) text-(--theme-text) font-sans overflow-hidden min-h-screen transition-colors duration-300"
  [ngClass]="isDarkMode ? 'dark-mode' : ''">
  
  <aside class="w-55 bg-(--theme-surface) border-r border-(--theme-border) flex flex-col shrink-0 transition-colors duration-300">
    <!-- Top Logo Section -->
    <div class="px-5 py-4 border-b border-(--theme-border) transition-colors duration-300">
      <div class="text-lg font-medium text-[#1f6feb] tracking-tight font-display">⬡ TaxEase</div>
      <div class="text-[10px] text-(--theme-muted) mt-0.5 transition-colors duration-300">Public Tax Filing System</div>
    </div>

    <!-- Navigation Links -->
    <nav class="flex-1 px-2.5 py-3 overflow-y-auto">
      @for (item of (filteredNavItems$ | async); track item.label) {
        <a [routerLink]="item.route"
           routerLinkActive="bg-(--theme-card) text-[#1f6feb]"
           class="flex items-center gap-2.5 px-2.5 py-2 rounded-md transition-all duration-200 hover:bg-(--theme-card)">
          <div class="w-4 h-4 bg-(--theme-border) opacity-50 rounded-sm"></div>
          <span class="text-[13px]">{{ item.label }}</span>
          
          @if (item.badge) {
            <span class="ml-auto bg-[#238636] text-[#7ee787] text-[10px] px-1.5 py-px rounded-full">
              {{ item.badge }}
            </span>
          }
        </a>
      }
    </nav>

    <div class="px-3.5 py-3 border-t border-(--theme-border) transition-colors duration-300">
      <div class="text-[11px] text-(--theme-muted) bg-(--theme-card) border border-(--theme-border) px-2.5 py-1 rounded-full inline-block transition-colors duration-300">
        Role: {{ userRole$ | async }}
      </div>
      
      <button (click)="logout()" 
        class="flex items-center gap-2 px-2.5 py-2 rounded-md text-[#f85149] hover:bg-[#f85149]/10 transition-all duration-200 text-[13px] font-medium group">
        <span class="opacity-70 group-hover:opacity-100">Logout</span>
        <span class="ml-auto opacity-50">↩</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="h-13 border-b border-(--theme-border) flex items-center px-5 gap-3 bg-(--theme-surface) shrink-0 transition-colors duration-300">
      <div class="flex items-center gap-3 ml-auto">
        <button (click)="toggleTheme()" class="flex items-center justify-between w-12 h-6 bg-(--theme-card) border border-(--theme-border) rounded-full px-1 cursor-pointer transition-colors duration-300">
           <span class="text-[12px]">☀️</span>
           <span class="text-[12px]">🌙</span>
        </button>

        <div routerLink="/portal/notifications" class="w-8 h-8 rounded-md bg-(--theme-card) border border-(--theme-border) flex items-center justify-center cursor-pointer relative text-(--theme-muted) text-sm hover:text-(--theme-text) transition-colors duration-300">
          🔔
          <div *ngIf="notificationCount > 0" class="w-2 h-2 bg-[#f85149] rounded-full absolute top-1 right-1"></div>
        </div>

        <div routerLink="/portal/profile" class="flex items-center gap-2 cursor-pointer hover:bg-(--theme-card) p-1 rounded-md transition-colors duration-300">
          <div class="w-7 h-7 rounded-full bg-linear-to-br from-[#1f6feb] to-[#0969da] flex items-center justify-center text-[11px] font-medium text-white font-display">
             {{ userInitials$ | async }}
          </div>
          <div>
            <div class="text-[13px] text-(--theme-text) leading-tight transition-colors duration-300">{{ userName$ | async}}</div>
            <div class="text-[10px] text-(--theme-muted) transition-colors duration-300">{{ userRole$ |async}}</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <div class="flex-1 overflow-y-auto p-6 bg-(--theme-bg) transition-colors duration-300">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
