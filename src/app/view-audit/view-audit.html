<div class="max-w-4xl mx-auto animate-fade-in pb-12">
  <!-- This block only renders once the Observable (auditData$) has data -->
  <div *ngIf="auditData$ | async as audit; else loadingTemplate">
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <button (click)="goBack()" class="text-[var(--theme-muted)] text-xl">←</button>
        <h1 class="text-2xl font-bold text-[var(--theme-text)]">Audit Case Details</h1>
      </div>

      <div class="flex gap-3">
        <!-- Close button shows only if ACTIVE -->
        <!-- Use .toUpperCase() here to ensure it matches regardless of backend casing -->
        <button
          *ngIf="audit.status.toUpperCase() === 'ACTIVE' && !isClosingAudit"
          (click)="initiateClose()"
          class="bg-[#238636] hover:bg-[#2ea043] text-white rounded-lg px-4 py-2 text-[13px] font-medium transition-colors shadow-lg shadow-green-500/10 flex items-center gap-2"
        >
          <span>✓</span> Close Audit Case
        </button>
      </div>
    </div>

    <!-- Data Cards -->
    <div class="bg-[var(--theme-card)] border border-[var(--theme-border)] rounded-xl p-6 mb-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
        <div>
          <p class="text-[11px] text-[var(--theme-muted)] uppercase mb-1">System ID</p>
          <p class="text-[15px] font-mono font-medium text-[var(--theme-text)]">
            AUD-{{ audit.id }}
          </p>
        </div>
        <div>
          <p class="text-[11px] text-[var(--theme-muted)] uppercase mb-2">Status</p>
          <span
            class="px-2.5 py-0.5 rounded-full border text-[11px] font-medium"
            [ngClass]="
              audit.status === 'ACTIVE'
                ? 'bg-[#1f6feb]/10 text-[#1f6feb] border-[#1f6feb]/20'
                : 'bg-[#3fb950]/10 text-[#3fb950] border-[#3fb950]/20'
            "
          >
            {{ audit.status }}
          </span>
        </div>
      </div>
    </div>

    <!-- Scope/Findings Card -->
    <div class="bg-[var(--theme-card)] border border-[var(--theme-border)] rounded-xl p-6 mb-6">
      <h2 class="text-[14px] font-bold text-[var(--theme-text)] mb-3">Audit Scope</h2>
      <!-- CHANGED text-white TO text-[var(--theme-text)] -->
      <div
        class="bg-[var(--theme-bg)] p-4 rounded-lg text-[var(--theme-text)] mb-6 border border-[var(--theme-border)]"
      >
        {{ audit.scope }}
      </div>

      <h2 class="text-[14px] font-bold text-[var(--theme-text)] mb-3">Findings</h2>
      <!-- CHANGED text-white TO text-[var(--theme-text)] -->
      <div
        class="bg-[var(--theme-bg)] p-4 rounded-lg text-[var(--theme-text)] border border-[var(--theme-border)]"
      >
        {{ audit.findings || 'No findings recorded yet.' }}
      </div>
    </div>

    <!-- The Actual Close Functionality Form -->
    <div
      *ngIf="isClosingAudit"
      class="bg-[var(--theme-card)] border-2 border-[#238636] rounded-xl p-6 animate-fade-in shadow-xl"
    >
      <h3 class="text-[#3fb950] font-bold text-lg mb-4 flex items-center gap-2">
        <span>🔒</span> Finalize Audit Findings
      </h3>
      <textarea
        [(ngModel)]="closeRequest.findings"
        placeholder="Enter final summary to close this case..."
        class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] p-4 rounded-lg text-white mb-4 outline-none focus:border-[#3fb950]"
        rows="5"
      ></textarea>

      <div class="flex justify-end gap-3">
        <button
          (click)="cancelClose()"
          class="px-5 py-2 text-[var(--theme-muted)] hover:text-white transition-colors"
        >
          Cancel
        </button>
        <button
          (click)="submitCloseAudit()"
          class="bg-[#238636] text-white px-6 py-2 rounded-lg font-bold"
        >
          Submit & Close Case
        </button>
      </div>
    </div>
  </div>

  <!-- Loading Template (Shown until auditData$ has data) -->
  <ng-template #loadingTemplate>
    <div
      class="text-center py-20 bg-[var(--theme-card)] rounded-xl border border-[var(--theme-border)]"
    >
      <div class="animate-pulse text-[var(--theme-muted)]">
        Syncing with database for AUD-{{ currentAuditId }}...
      </div>
    </div>
  </ng-template>
</div>
