<div class="bg-[#161b22] border border-app-border rounded-lg p-4 relative overflow-hidden cursor-pointer hover:border-[#30363d] transition-colors before:content-[''] before:absolute before:top-0 before:left-0 before:right-0 before:h-[2px] {{ themeClasses.border }}">
  
  <div class="flex justify-between items-start mb-3">
    <div class="text-[11px] text-app-muted uppercase tracking-wider">{{ label }}</div>
    <div class="w-7 h-7 rounded-md flex items-center justify-center text-[13px] {{ themeClasses.iconBg }} {{ themeClasses.iconColor }}">
      {{ icon }}
    </div>
  </div>
  
  <div class="text-2xl font-medium text-app-text leading-none mb-1.5" [class.text-lg]="value === 'Up to date'">
    {{ value }}
  </div>
  
  <div class="text-[11px] flex items-center gap-1" 
       [ngClass]="{
         'text-[#3fb950]': trendType === 'up',
         'text-[#f85149]': trendType === 'down',
         'text-app-muted': trendType === 'neutral'
       }">
    {{ trendText }}
  </div>
</div>
