<div class="bg-(--theme-card) border border-(--theme-border) rounded-lg p-4 relative overflow-hidden cursor-pointer hover:border-[#1f6feb] transition-colors duration-300 before:content-[''] before:absolute before:top-0 before:left-0 before:right-0 before:h-[2px] {{ themeClasses.border }}">
  
  <div class="flex justify-between items-start mb-3">
    <div class="text-[11px] text-(--theme-muted) uppercase tracking-wider transition-colors duration-300">{{ label }}</div>
    <div class="w-7 h-7 rounded-md flex items-center justify-center text-[13px] transition-colors duration-300 {{ themeClasses.iconBg }} {{ themeClasses.iconColor }}">
      {{ icon }}
    </div>
  </div>
  
  <div class="text-2xl font-medium text-(--theme-text) leading-none mb-1.5 transition-colors duration-300" [class.text-lg]="value === 'Up to date'">
    {{ value }}
  </div>
  
  <div class="text-[11px] flex items-center gap-1 transition-colors duration-300" 
       [ngClass]="{
         'text-[#3fb950]': trendType === 'up',
         'text-[#f85149]': trendType === 'down',
         'text-(--theme-muted)': trendType === 'neutral'
       }">
    {{ trendText }}
  </div>
</div>
