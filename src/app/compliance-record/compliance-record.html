<div
    *ngIf="selectedRecord"
    class="bg-[var(--theme-card)] border border-[var(--theme-border)] transition-colors duration-300 rounded-xl shadow-lg animate-fade-in overflow-hidden mt-6"
  >
    <div class="px-6 py-4 border-b border-[var(--theme-border)] bg-[var(--theme-bg)] transition-colors duration-300">
      <h2 class="text-[16px] font-bold text-[var(--theme-text)] transition-colors duration-300">
        Update Compliance Record: <span class="text-[#1f6feb]">{{ selectedRecord.id }}</span>
      </h2>
    </div>

    <div class="p-6">
      <div *ngIf="successMessage" class="bg-[#3fb950]/10 text-[#3fb950] border border-[#3fb950]/20 p-4 rounded-md mb-5 text-[13px] font-medium">
        ✓ {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="bg-[#f85149]/10 text-[#f85149] border border-[#f85149]/20 p-4 rounded-md mb-5 text-[13px] font-medium">
        ⚠ Error: {{ errorMessage }}
      </div>

      <div class="mb-5 max-w-sm">
        <label class="block text-[12px] font-medium text-[var(--theme-text)] transition-colors duration-300 mb-2">
          Update Status <span class="text-[#f85149]">*</span>
        </label>
        <select
          [(ngModel)]="updateData.result"
          aria-label="Update Status"
          class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] transition-colors duration-300 rounded-lg text-[var(--theme-text)] text-[13px] px-3 py-2.5 outline-none focus:border-[#1f6feb] cursor-pointer appearance-none"
        >
          <option value="Compliant">Compliant</option>
          <option value="Non-Compliant">Non-Compliant</option>
          <option value="Pending">Pending</option>
        </select>
      </div>

      <div class="mb-6">
        <label class="block text-[12px] font-medium text-[var(--theme-text)] transition-colors duration-300 mb-2">
          Reason / Notes <span class="text-[#f85149]">*</span>
        </label>
        <textarea
          [(ngModel)]="updateData.notes"
          rows="4"
          placeholder="Provide justification for this status update..."
          class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] transition-colors duration-300 rounded-lg text-[var(--theme-text)] text-[13px] px-4 py-3 outline-none focus:border-[#1f6feb] placeholder-[var(--theme-muted)] resize-y"
        ></textarea>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-[var(--theme-border)] transition-colors duration-300">
        <button
          (click)="cancelUpdate()"
          class="bg-transparent border border-[var(--theme-border)] text-[var(--theme-text)] transition-colors duration-300 rounded-lg px-5 py-2 text-[13px] font-medium hover:bg-[var(--theme-surface)]"
        >
          Cancel
        </button>
        
        <button
          (click)="saveUpdate()"
          [disabled]="!updateData.notes || isLoading"
          class="bg-[#1f6feb] hover:bg-[#388bfd] text-white transition-colors duration-300 rounded-lg px-6 py-2 text-[13px] font-medium disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[120px]"
        >
          {{ isLoading ? 'Saving...' : 'Save Update' }}
        </button>
      </div>
    </div>
  </div>
