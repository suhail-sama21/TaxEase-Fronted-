<div class="min-h-screen bg-[var(--theme-bg)] transition-colors duration-300">
  <!-- Header Section -->
  <div class="sticky top-0 z-40 bg-[var(--theme-surface)] border-b border-[var(--theme-border)] backdrop-blur-md bg-opacity-95 transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between animate-fadeInDown">
      <div>
        <h1 class="text-2xl font-bold text-[var(--theme-text)] transition-colors duration-300">Profile Management</h1>
        <p class="text-sm text-[var(--theme-muted)] mt-1 transition-colors duration-300">Manage your personal and contact information.</p>
      </div>
      <button (click)="saveProfile()" [disabled]="isSaving" class="bg-gradient-to-r from-[#1f6feb] to-[#0969da] hover:from-[#0969da] hover:to-[#0860ca] text-white rounded-lg px-6 py-2.5 text-sm font-semibold transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-lg hover:shadow-blue-500/20 active:scale-95 flex items-center gap-2">
        <svg *ngIf="!isSaving" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <svg *ngIf="isSaving" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
        {{ isSaving ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-6 py-8">
    <!-- Profile Card Header -->
    <div class="bg-gradient-to-br from-[var(--theme-card)] to-[var(--theme-surface)] border border-[var(--theme-border)] rounded-2xl p-8 mb-8 transition-colors duration-300 hover:shadow-xl animate-fadeInUp hover:border-[#1f6feb]/30 profile-card-hover opacity-100">
      <div class="flex items-center gap-8">
        <!-- Avatar -->
        <div class="relative">
          <div class="w-28 h-28 rounded-2xl bg-gradient-to-br from-[#1f6feb] via-[#0969da] to-[#0860ca] flex items-center justify-center text-5xl font-bold text-white shadow-xl shadow-blue-500/30 group-hover:shadow-2xl group-hover:shadow-blue-500/40 transition-all duration-300 group-hover:scale-105 shrink-0">
            JD
          </div>
          <div class="absolute -bottom-2 -right-2 bg-[#3fb950] rounded-full w-8 h-8 border-4 border-[var(--theme-card)] flex items-center justify-center text-white text-xs font-bold shadow-lg">✓</div>
        </div>

        <!-- User Info -->
        <div class="flex-1">
          <h2 class="text-3xl font-bold text-[var(--theme-text)] mb-2 transition-colors duration-300">{{userProfile().fullName}}</h2>
          <div class="text-lg text-[#1f6feb] font-mono font-semibold mb-3">TXP-987654321</div>
          <div class="flex flex-wrap gap-3 mb-4">
            <span class="bg-[#3fb950]/10 text-[#3fb950] px-3 py-1 rounded-full text-xs font-medium border border-[#3fb950]/20">Individual</span>
            <span class="bg-[#1f6feb]/10 text-[#1f6feb] px-3 py-1 rounded-full text-xs font-medium border border-[#1f6feb]/20">{{userProfile().type}}</span>
            <span class="bg-[#17a2b8]/10 text-[#17a2b8] px-3 py-1 rounded-full text-xs font-medium border border-[#17a2b8]/20">Active since 2023</span>
          </div>
          <p class="text-sm text-[var(--theme-muted)] transition-colors duration-300">Account Status: <span class="text-[#3fb950] font-semibold">Verified & Active</span></p>
        </div>

        <!-- Action Button -->
        <button class="bg-gradient-to-r from-purple-500/10 to-blue-500/10 border border-purple-500/30 text-[var(--theme-text)] rounded-xl px-6 py-3 text-sm font-semibold hover:from-purple-500/20 hover:to-blue-500/20 hover:border-purple-500/50 transition-all duration-300 hover:shadow-lg group/btn">
          <svg class="w-5 h-5 inline-block mr-2 group-hover/btn:rotate-12 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Change Photo
        </button>
      </div>
    </div>

    <!-- Personal Information Section -->
    <div class="bg-[var(--theme-card)] border border-[var(--theme-border)] rounded-2xl overflow-hidden mb-8 transition-colors duration-300 hover:shadow-xl animate-fadeInUp hover:border-[var(--theme-text)]/10 opacity-100" style="animation-delay: 0.1s;">
      <div class="px-8 py-6 border-b border-[var(--theme-border)] bg-gradient-to-r from-[var(--theme-surface)] to-[var(--theme-card)] transition-colors duration-300">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-[#1f6feb]/10 flex items-center justify-center">
            <svg class="w-6 h-6 text-[#1f6feb]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <h2 class="text-lg font-bold text-[var(--theme-text)] transition-colors duration-300">Personal Information</h2>
        </div>
      </div>
      <div class="p-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Full Name -->
          <div class="group">
            <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">Full name <span class="text-[#f85149]">*</span></label>
            <div class="relative">
              <input type="text" [(ngModel)]="userProfile().fullName" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#1f6feb] focus:shadow-lg focus:shadow-blue-500/10 transition-all duration-300 group-hover:border-[var(--theme-text)]/30" />
              <div class="absolute right-3 top-3.5 text-[var(--theme-muted)] opacity-0 group-focus-within:opacity-100 transition-opacity duration-300">
                <svg class="w-5 h-5 text-[#3fb950]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              </div>
            </div>
          </div>

          <!-- Email Address -->
          <div class="group">
            <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">Email address <span class="text-[#f85149]">*</span></label>
            <div class="relative">
              <input type="email" [(ngModel)]="userProfile().email" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#1f6feb] focus:shadow-lg focus:shadow-blue-500/10 transition-all duration-300 group-hover:border-[var(--theme-text)]/30" />
              <div class="absolute right-3 top-3.5 text-[var(--theme-muted)] opacity-0 group-focus-within:opacity-100 transition-opacity duration-300">
                <svg class="w-5 h-5 text-[#3fb950]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              </div>
            </div>
          </div>

          <!-- Phone Number -->
          <div class="group">
            <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">Phone number <span class="text-[#f85149]">*</span></label>
            <div class="relative">
              <input type="text" [(ngModel)]="userProfile().phone" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#1f6feb] focus:shadow-lg focus:shadow-blue-500/10 transition-all duration-300 group-hover:border-[var(--theme-text)]/30" />
              <div class="absolute right-3 top-3.5 text-[var(--theme-muted)] opacity-0 group-focus-within:opacity-100 transition-opacity duration-300">
                <svg class="w-5 h-5 text-[#3fb950]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              </div>
            </div>
          </div>

          <!-- Taxpayer Type -->
          <div class="group">
            <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">Taxpayer type <span class="text-[#f85149]">*</span></label>
            <div class="relative">
              <select [(ngModel)]="userProfile().type" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#1f6feb] focus:shadow-lg focus:shadow-blue-500/10 cursor-pointer appearance-none transition-all duration-300 group-hover:border-[var(--theme-text)]/30">
                <option>Citizen</option>
                <option>Business</option>
                <option>Non-resident</option>
              </select>
              <svg class="absolute right-3 top-3.5 w-5 h-5 text-[var(--theme-muted)] pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
            </div>
          </div>

          <!-- Residential Address -->
          <div class="col-span-1 md:col-span-2 group">
            <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">Residential address <span class="text-[#f85149]">*</span></label>
            <div class="relative">
              <input type="text" [(ngModel)]="userProfile().address" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#1f6feb] focus:shadow-lg focus:shadow-blue-500/10 transition-all duration-300 group-hover:border-[var(--theme-text)]/30" />
            </div>
          </div>

          <!-- Date of Birth -->
          <div class="group">
            <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">Date of birth</label>
            <div class="relative">
              <input type="date" [(ngModel)]="userProfile().dob" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#1f6feb] focus:shadow-lg focus:shadow-blue-500/10 transition-all duration-300 group-hover:border-[var(--theme-text)]/30" />
            </div>
          </div>

          <!-- National ID / PAN -->
          <div class="group">
            <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">National ID / PAN</label>
            <div class="relative">
              <input type="text" [(ngModel)]="userProfile().pan" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#1f6feb] focus:shadow-lg focus:shadow-blue-500/10 transition-all duration-300 group-hover:border-[var(--theme-text)]/30" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Security Section -->
    <div class="bg-[var(--theme-card)] border border-[var(--theme-border)] rounded-2xl overflow-hidden transition-colors duration-300 hover:shadow-xl animate-fadeInUp hover:border-[var(--theme-text)]/10 opacity-100" style="animation-delay: 0.2s;">
      <div class="px-8 py-6 border-b border-[var(--theme-border)] bg-gradient-to-r from-[var(--theme-surface)] to-[var(--theme-card)] transition-colors duration-300">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-lg bg-[#f85149]/10 flex items-center justify-center">
            <svg class="w-6 h-6 text-[#f85149]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          </div>
          <h2 class="text-lg font-bold text-[var(--theme-text)] transition-colors duration-300">Security & Password</h2>
        </div>
      </div>
      <div class="p-8">
        <div class="space-y-6">
          <!-- Info Box -->
          <div *ngIf="passwordInfoAppear" class="rounded-xl p-4 flex gap-3 border" [style.backgroundColor]="boxColor + '1A'" [style.borderColor]="boxColor">
            <svg class="w-5 h-5 flex-shrink-0 mt-0.5" [style.color]="boxColor" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-sm text-[var(--theme-text)] transition-colors duration-300">{{infoMessage}}</p>
          </div>

          <!-- Password Fields -->
          <div class="grid grid-cols-1 gap-6">
            <!-- Current Password -->
            <div class="group">
              <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">Current password</label>
              <div class="relative">
                <input [type]="showCurrentPassword ? 'text' : 'password'" [(ngModel)]="security.currentPassword" placeholder="••••••••" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#f85149] focus:shadow-lg focus:shadow-red-500/10 transition-all duration-300 group-hover:border-[var(--theme-text)]/30" />
                <button type="button" (click)="togglePasswordVisibility('current')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--theme-text)]">
                  <svg *ngIf="!showCurrentPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm3.1 3.1A9 9 0 0112 21a9 9 0 01-6.1-5.9M3 3l18 18"></path></svg>
                  <svg *ngIf="showCurrentPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.97 0-9-4.03-9-9a9.98 9.98 0 011.23-4.65M9.88 9.88a3 3 0 104.24 4.24M12 6v.01"></path></svg>
                </button>
              </div>
            </div>

            <!-- New Password & Confirm -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="group">
                <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">New password</label>
                <div class="relative">
                  <input [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="security.newPassword" placeholder="••••••••" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#0969da] focus:shadow-lg focus:shadow-blue-500/10 transition-all duration-300 group-hover:border-[var(--theme-text)]/30" />
                  <button type="button" (click)="togglePasswordVisibility('new')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--theme-text)]">
                    <svg *ngIf="!showNewPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm3.1 3.1A9 9 0 0112 21a9 9 0 01-6.1-5.9M3 3l18 18"></path></svg>
                    <svg *ngIf="showNewPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.97 0-9-4.03-9-9a9.98 9.98 0 011.23-4.65M9.88 9.88a3 3 0 104.24 4.24M12 6v.01"></path></svg>
                  </button>
                </div>
              </div>

              <div class="group">
                <label class="block text-xs font-semibold text-[var(--theme-muted)] mb-2.5 uppercase tracking-wide transition-colors duration-300">Confirm new password</label>
                <div class="relative">
                  <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="security.confirmPassword" placeholder="••••••••" class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-xl text-[var(--theme-text)] text-sm px-4 py-3 outline-none focus:border-[#0969da] focus:shadow-lg focus:shadow-blue-500/10 transition-all duration-300 group-hover:border-[var(--theme-text)]/30" />
                  <button type="button" (click)="togglePasswordVisibility('confirm')" class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--theme-text)]">
                    <svg *ngIf="!showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm3.1 3.1A9 9 0 0112 21a9 9 0 01-6.1-5.9M3 3l18 18"></path></svg>
                    <svg *ngIf="showConfirmPassword" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.97 0-9-4.03-9-9a9.98 9.98 0 011.23-4.65M9.88 9.88a3 3 0 104.24 4.24M12 6v.01"></path></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="flex gap-3 pt-4">
            <button (click)="updatePassword()" [disabled]="isSavingPassword || !security.currentPassword || !security.newPassword" class="flex-1 bg-gradient-to-r from-[#f85149] to-[#fb8500] hover:from-[#fb8500] hover:to-[#f77f00] text-white rounded-xl px-6 py-3 text-sm font-semibold transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-lg hover:shadow-red-500/20 active:scale-95 flex items-center justify-center gap-2">
              <svg *ngIf="!isSavingPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
              <svg *ngIf="isSavingPassword" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
              {{ isSavingPassword ? 'Updating...' : 'Update Password' }}
            </button>
            <button type="button" class="px-6 py-3 rounded-xl border border-[var(--theme-border)] text-[var(--theme-text)] text-sm font-semibold hover:bg-[var(--theme-surface)] transition-all duration-300">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
