<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-xl font-medium text-(--theme-text) transition-colors duration-300">Profile Management</h1>
      <p class="text-[13px] text-(--theme-muted) mt-1 transition-colors duration-300">Manage your personal and contact information.</p>
    </div>
    <button (click)="saveProfile()" [disabled]="isSaving" class="bg-[#1f6feb] hover:bg-[#0969da] text-white rounded-md px-4 py-2 text-[13px] font-medium transition-colors duration-300 disabled:opacity-50">
      {{ isSaving ? 'Saving...' : 'Save Changes' }}
    </button>
  </div>

  <div class="bg-(--theme-card) border border-(--theme-border) rounded-xl p-6 mb-6 flex items-center gap-5 transition-colors duration-300">
    <div class="w-20 h-20 rounded-full bg-linear-to-br from-[#1f6feb] to-[#0969da] flex items-center justify-center text-2xl font-bold text-white font-display shrink-0 shadow-lg">
      JD
    </div>
    <div>
      <h2 class="text-xl font-medium text-(--theme-text) mb-1 transition-colors duration-300">John Doe</h2>
      <div class="text-[13px] text-[#1f6feb] font-mono mb-1">TXP-987654321</div>
      <div class="text-[12px] text-(--theme-muted) transition-colors duration-300">Individual · Citizen · Active since 2023</div>
    </div>
    <div class="ml-auto">
      <button class="bg-transparent border border-(--theme-border) text-(--theme-muted) rounded-lg px-4 py-2 text-[12px] hover:bg-(--theme-surface) hover:text-(--theme-text) transition-colors duration-300">
        Change Photo
      </button>
    </div>
  </div>

  <div class="bg-(--theme-card) border border-(--theme-border) rounded-xl overflow-hidden mb-6 transition-colors duration-300">
    <div class="px-5 py-4 border-b border-(--theme-border) transition-colors duration-300">
      <h2 class="text-[15px] font-medium text-(--theme-text) transition-colors duration-300">Personal Information</h2>
    </div>
    <div class="p-6">
      <div class="grid grid-cols-2 gap-5">
        <div>
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">Full name <span class="text-[#f85149]">*</span></label>
          <input type="text" [(ngModel)]="userProfile.fullName" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] transition-colors duration-300" />
        </div>
        <div>
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">Email address <span class="text-[#f85149]">*</span></label>
          <input type="email" [(ngModel)]="userProfile.email" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] transition-colors duration-300" />
        </div>
        <div>
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">Phone number <span class="text-[#f85149]">*</span></label>
          <input type="text" [(ngModel)]="userProfile.phone" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] transition-colors duration-300" />
        </div>
        <div>
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">Taxpayer type <span class="text-[#f85149]">*</span></label>
          <select [(ngModel)]="userProfile.type" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] cursor-pointer appearance-none transition-colors duration-300">
            <option>Citizen</option>
            <option>Business</option>
            <option>Non-resident</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">Residential address <span class="text-[#f85149]">*</span></label>
          <input type="text" [(ngModel)]="userProfile.address" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] transition-colors duration-300" />
        </div>
        <div>
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">Date of birth</label>
          <input type="date" [(ngModel)]="userProfile.dob" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] transition-colors duration-300" />
        </div>
        <div>
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">National ID / PAN</label>
          <input type="text" [(ngModel)]="userProfile.pan" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] transition-colors duration-300" />
        </div>
      </div>
    </div>
  </div>

  <div class="bg-(--theme-card) border border-(--theme-border) rounded-xl overflow-hidden mb-6 transition-colors duration-300">
    <div class="px-5 py-4 border-b border-(--theme-border) transition-colors duration-300">
      <h2 class="text-[15px] font-medium text-(--theme-text) transition-colors duration-300">Security</h2>
    </div>
    <div class="p-6">
      <div class="grid grid-cols-2 gap-5 mb-5">
        <div>
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">Current password</label>
          <input type="password" [(ngModel)]="security.currentPassword" placeholder="••••••••" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] transition-colors duration-300" />
        </div>
        <div></div> <div>
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">New password</label>
          <input type="password" [(ngModel)]="security.newPassword" placeholder="••••••••" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] transition-colors duration-300" />
        </div>
        <div>
          <label class="block text-xs text-(--theme-muted) mb-1.5 transition-colors duration-300">Confirm new password</label>
          <input type="password" [(ngModel)]="security.confirmPassword" placeholder="••••••••" class="w-full bg-(--theme-bg) border border-(--theme-border) rounded-lg text-(--theme-text) text-sm px-3 py-2.5 outline-none focus:border-[#1f6feb] transition-colors duration-300" />
        </div>
      </div>
      <button (click)="updatePassword()" [disabled]="isSavingPassword || !security.currentPassword || !security.newPassword" class="bg-transparent border border-(--theme-border) text-(--theme-muted) rounded-lg px-4 py-2 text-[12px] hover:bg-(--theme-surface) hover:text-(--theme-text) transition-colors duration-300 disabled:opacity-50">
        {{ isSavingPassword ? 'Updating...' : 'Update Password' }}
      </button>
    </div>
  </div>
</div>
